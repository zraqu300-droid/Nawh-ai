name: Nawh.ai CI/CD Pipeline

# تشغيل الأكشن تلقائياً عند الدفع (Push) أو عمل Pull Request على فرع main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. مرحلة فحص وجودة الكود وبناء واجهة الويب (Vite + React)
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code (Optional but highly recommended for sales)
        run: npm run lint --if-present

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vite-production-build
          path: dist/

  # 2. مرحلة بناء تطبيق الأندرويد (Android APK) عبر Capacitor
  build-android:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Web Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vite-production-build
          path: dist/

      - name: Setup Java JDK 17 (Required for Android SDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nawh-ai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 3. مرحلة فحص ومزامنة ملفات الآيفون (iOS)
  # ملاحظة: بناء نسخة iOS (IPA) بشكل كامل يتطلب بيئة macOS (تم إعداد المزامنة هنا)
  sync-ios:
    needs: build-and-lint
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Web Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vite-production-build
          path: dist/

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
