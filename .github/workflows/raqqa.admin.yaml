name: "إنتاج تطبيق إدارة nawh-ai"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4a. Cache Node Modules
        uses: actions/cache@v4
        with:
          path: admin/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('admin/package-lock.json', 'admin/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # تم تنظيف وتخفيف التثبيت تماماً من أي مكتبات خارجية وإشعارات
      - name: 4b. Clean & Install Dependencies
        working-directory: ./admin
        run: |
          rm -rf android ios dist_web
          npm install --legacy-peer-deps

      - name: 4c. Compile Web Assets
        working-directory: ./admin
        run: |
          npm run build

      # حقن هوية التطبيق (الاسم والحزمة) مباشرة في ملف الإعداد الرئيسي لكاباسيتور
      - name: 4d. Set Capacitor Config
        working-directory: ./admin
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.raqqa.admin",
            "appName": "nawh.ai Admin",
            "webDir": "dist_web",
            "bundledWebRuntime": false
          }
          EOF

      # إنشاء الأندرويد بالهوية الجديدة تلقائياً بدون تلاعب بالملفات الداخلية
      - name: 5. Initialize Android Platform
        working-directory: ./admin
        run: |
          npx cap add android
          npx cap sync android

      # حقن ملف الفايربيس فقط في مساره الثابت والمضمون
      - name: 6. Inject Firebase Config
        shell: bash
        run: |
          mkdir -p admin/android/app/
          cat <<EOF > admin/android/app/google-services.json
          {
            "project_info": {
              "project_number": "162488255991",
              "project_id": "raqqa-43dc8",
              "storage_bucket": "raqqa-43dc8.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2",
                  "android_client_info": { "package_name": "com.raqqa.admin" }
                },
                "api_key": [ { "current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 7. Build Android Binaries (APK & AAB)
        working-directory: ./admin/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: 8. Sign Production APK & AAB
        run: |
          keytool -genkey -v -keystore admin_release.jks -alias admin_alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "nawh_pass_2026" -keypass "nawh_pass_2026" \
            -dname "CN=NawhAdmin, OU=Dev, O=Nawh, L=Cairo, S=Egypt, C=EG"
          
          APK_PATH=$(find admin/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks admin_release.jks \
            --ks-pass pass:"nawh_pass_2026" --out Nawh-Admin.apk "$APK_PATH"
          
          AAB_PATH=$(find admin/android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          jarsigner -keystore admin_release.jks -storepass "nawh_pass_2026" "$AAB_PATH" admin_alias
          cp "$AAB_PATH" Nawh-Admin.aab

      - name: 9. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nawh-Admin-Build
          path: |
            Nawh-Admin.apk
            Nawh-Admin.aab

      - name: 10. Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v${{ github.run_number }}
          name: "Nawh.ai Admin Panel v${{ github.run_number }}"
          files: |
            Nawh-Admin.apk
            Nawh-Admin.aab
            admin_release.jks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
