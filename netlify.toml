# 🛠️ إعدادات بناء وتشغيل مشروع Vite والـ Functions
[build]
  command = "npm run build"
  publish = "dist"

# 📂 توجيه Netlify لقراءة ملفات الـ API كـ Serverless Functions
[functions]
  directory = "api"

# 🚀 القاعدة الأولى: توجيه طلبات الـ API إلى مجلد الـ Functions مباشرة (يجب أن تكون في الأعلى)
[[redirects]]
  from = "/api/*"
  status = 200

# 🔮 القاعدة الثانية: منع ظهور الشاشة البيضاء عند تحديث صفحات الـ React (SPA Routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
